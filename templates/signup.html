<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CloudShield AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatGlow {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 0.2; }
            50% { transform: translateY(-15px) scale(1.05); opacity: 0.35; }
        }
        .page-animate { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .bg-glow { animation: floatGlow 8s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 md:p-8 selection:bg-cyan-500 selection:text-slate-950 relative overflow-hidden font-sans">

    <!-- Background Glow -->
    <div class="absolute -top-32 -right-32 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none bg-glow"></div>
    <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none bg-glow" style="animation-delay: -4s;"></div>

    <!-- Container -->
    <div class="w-full max-w-md rounded-3xl border border-slate-800/80 bg-slate-900/60 backdrop-blur-xl shadow-2xl p-8 md:p-10 page-animate relative z-10">
        
        <div class="text-center mb-8">
            <div class="inline-flex p-3 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-2xl mb-3">
                🛡️
            </div>
            <h2 class="text-2xl font-black text-white">Create Account</h2>
            <p class="text-slate-400 text-xs mt-1">Get started with CloudShield AI platform</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-xl text-xs font-semibold border 
                        {% if category == 'success' %}bg-green-500/10 text-green-400 border-green-500/30
                        {% else %}bg-red-500/10 text-red-400 border-red-500/30{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <!-- Username -->
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
                <input type="text" name="username" required placeholder="kareem" 
                    class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-slate-200 placeholder:text-slate-600 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20 text-xs transition-all duration-200">
            </div>

            <!-- Email or Phone -->
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Email or Phone</label>
                <input type="text" name="email_or_phone" required placeholder="kareem@example.com" 
                    class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-slate-200 placeholder:text-slate-600 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20 text-xs transition-all duration-200">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
                <input type="password" name="password" required placeholder="••••••••••••" 
                    class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-slate-200 placeholder:text-slate-600 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20 text-xs transition-all duration-200">
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-extrabold text-xs shadow-lg shadow-cyan-500/20 transition-all duration-200 active:scale-95 mt-2">
                Register New Account
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="text-cyan-400 hover:text-cyan-300 font-bold underline transition ml-1">Log In</a>
        </p>
    </div>
</body>
</html>
